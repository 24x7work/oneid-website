<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONEID Lab Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; height: 100vh; overflow: hidden; }

/* AUTH GATE */
#authGate { position: fixed; inset: 0; background: #f8fafc; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.auth-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
.auth-box h2 { margin-bottom: 20px; font-size: 24px; text-align: center; }
.auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
.auth-box button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

/* APP CONTAINER */
#appContainer { display: flex; height: 100vh; }

/* SIDEBAR */
#sidebar { width: 260px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; position: fixed; height: 100%; z-index: 100; transition: transform 0.3s; }
.sidebar-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
.brand { font-weight: 700; font-size: 18px; color: #4f46e5; }
.menu-toggle { background: none; border: none; cursor: pointer; padding: 5px; display: flex; flex-direction: column; gap: 4px; }
.menu-toggle span { display: block; width: 20px; height: 2px; background: #0f172a; transition: 0.3s; }

.nav-section { flex: 1; overflow-y: auto; padding: 20px 10px; }
.nav-title { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 10px; padding-left: 10px; }
.nav-item { display: flex; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer; color: #64748b; margin-bottom: 4px; }
.nav-item:hover, .nav-item.active { background: #f1f5f9; color: #4f46e5; }
.nav-item .icon { font-size: 20px; min-width: 30px; text-align: center; }
.nav-item .label { margin-left: 10px; }

.sidebar-footer { padding: 20px; border-top: 1px solid #e2e8f0; }
.user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.user-avatar { width: 32px; height: 32px; background: #4f46e5; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.user-details { flex: 1; }
.user-email { font-size: 13px; font-weight: 500; }
.user-role { font-size: 11px; color: #64748b; }
.logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 13px; }

/* MAIN CONTENT */
#mainContent { flex: 1; margin-left: 260px; overflow-y: auto; padding: 30px; }
.page-header { margin-bottom: 30px; }
.page-header h1 { font-size: 24px; margin-bottom: 5px; }
.page-header p { color: #64748b; font-size: 14px; }

.card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.card h3 { margin-bottom: 15px; font-size: 16px; }

.dropzone { border: 2px dashed #e2e8f0; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; }
.dropzone:hover { border-color: #4f46e5; background: #f8fafc; }

.btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; font-size: 14px; }
.btn-primary { background: #4f46e5; color: white; }
.btn-outline { background: transparent; border: 1px solid #e2e8f0; color: #0f172a; }

.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
.toggle { width: 44px; height: 24px; background: #cbd5e1; border-radius: 12px; position: relative; cursor: pointer; transition: 0.3s; }
.toggle.on { background: #10b981; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s; }
.toggle.on::after { left: 22px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; }
.modal-overlay.active { display: flex; }
.modal { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
.modal h3 { margin-bottom: 20px; }
.modal input, .modal select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 6px; }

.hidden { display: none !important; }

/* MOBILE */
@media (max-width: 768px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.mobile-open { transform: translateX(0); }
  #mainContent { margin-left: 0; }
}
</style>
</head>
<body>

<!-- AUTH GATE -->
<div id="authGate">
  <div class="auth-box">
    <h2>ONEID Lab Hub</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="appContainer" class="hidden">
  
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="brand">ONEID Lab</div>
      <button class="menu-toggle" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
    </div>
    
    <div class="nav-section">
      <div class="nav-title">Core Tools</div>
      <div class="nav-item active" onclick="switchTab('migration')">
        <div class="icon">🔄</div>
        <div class="label">Migration Converter</div>
      </div>
      <div class="nav-item" onclick="switchTab('settings')">
        <div class="icon">⚙️</div>
        <div class="label">Universal Settings</div>
      </div>
      <div class="nav-item" onclick="openUserModal()">
        <div class="icon">👥</div>
        <div class="label">User Management</div>
      </div>

      <div class="nav-title" style="margin-top:20px;">Site Navigator</div>
      <div id="sitesList"></div>
      <div class="nav-item" onclick="addNewSite()">
        <div class="icon">+</div>
        <div class="label">Add New Site</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-details">
          <div class="user-email" id="userEmail">admin@24x7.work</div>
          <div class="user-role" id="userRole">ADMIN</div>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="mainContent">
    <div id="tabContent"></div>
  </div>
</div>

<!-- USER MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h3>User Management</h3>
    <input type="email" id="newUserEmail" placeholder="New User Email">
    <select id="newUserRole">
      <option value="sub_admin">Sub Admin</option>
      <option value="employee">Employee</option>
      <option value="viewer">Viewer</option>
    </select>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addUser()">Add User</button>
    </div>
    <div id="userListDisplay" style="margin-top:20px;"></div>
  </div>
</div>

<script>
const LAB_CONFIG = {
  tools: ['migration', 'settings', 'users'],
  sites: [
    { name: 'Home / Dashboard', path: '/index.html', icon: '🌐' },
    { name: 'Login Portal', path: '/login.html', icon: '' },
    { name: 'User Dashboard', path: '/dashboard.html', icon: '' },
    { name: 'Main App', path: '/app.html', icon: '📱' }
  ],
  settings: {
    auto_linter: true,
    auto_fk_fix: true,
    auto_naming: true,
    require_otp: false
  }
};

let state = {
  user: null,
  activeTab: 'migration',
  users: JSON.parse(localStorage.getItem('lab_users')) || [{ email: 'admin@24x7.work', role: 'admin', name: 'Admin' }]
};

function initApp() {
  renderSites();
  switchTab('migration');
}

function renderSites() {
  const html = LAB_CONFIG.sites.map(site => `
    <div class="nav-item" onclick="window.open('${site.path}', '_blank')">
      <div class="icon">${site.icon}</div>
      <div class="label">${site.name}</div>
    </div>
  `).join('');
  document.getElementById('sitesList').innerHTML = html;
}

function switchTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  
  if (tabId === 'migration') renderMigrationTab();
  else if (tabId === 'settings') renderSettingsTab();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
}

function renderMigrationTab() {
  document.getElementById('tabContent').innerHTML = `
    <div class="page-header">
      <h1>Migration Converter</h1>
      <p>Upload PDF/DOCX to generate PostgreSQL scripts.</p>
    </div>
    <div class="card">
      <h3>1. Upload Files</h3>
      <div class="dropzone" onclick="document.getElementById('fileInput').click()">
        <p>Click to upload or drag & drop</p>
        <p style="font-size:12px; margin-top:5px; color:#64748b;">Supports .pdf, .docx, .zip</p>
      </div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
      <div id="fileList" style="margin-top:15px;"></div>
      <button class="btn btn-primary" style="margin-top:20px; width:100%;" onclick="processFiles()">Extract & Analyze</button>
    </div>
    <div class="card hidden" id="resultCard">
      <h3>2. Results</h3>
      <p style="color:#10b981;">✅ Processing complete.</p>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn btn-primary">Download ZIP</button>
        <button class="btn btn-outline">Copy SQL</button>
      </div>
    </div>
  `;
}

function renderSettingsTab() {
  const html = Object.keys(LAB_CONFIG.settings).map(key => {
    const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    const isOn = LAB_CONFIG.settings[key] ? 'on' : '';
    return `
      <div class="setting-row">
        <div>
          <div style="font-weight:500;">${label}</div>
          <div style="font-size:12px; color:#64748b;">Toggle this feature</div>
        </div>
        <div class="toggle ${isOn}" onclick="toggleSetting('${key}', this)"></div>
      </div>
    `;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <div class="page-header">
      <h1>Universal Settings</h1>
      <p>Configure Lab Hub behavior.</p>
    </div>
    <div class="card">
      <h3>Processing & Linter</h3>
      ${html}
    </div>
  `;
}

function toggleSetting(key, el) {
  LAB_CONFIG.settings[key] = !LAB_CONFIG.settings[key];
  el.classList.toggle('on');
}

function openUserModal() {
  document.getElementById('userModal').classList.add('active');
  renderUserList();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function renderUserList() {
  const html = state.users.map(u => `
    <div style="display:flex; justify-content:space-between; padding:10px; background:#f8fafc; border-radius:6px; margin-bottom:5px;">
      <div>
        <div style="font-weight:500;">${u.name}</div>
        <div style="font-size:12px; color:#64748b;">${u.email} • ${u.role}</div>
      </div>
      ${u.role !== 'admin' ? `<button class="btn btn-outline" style="padding:5px 10px; font-size:12px; color:#ef4444;" onclick="deleteUser('${u.email}')">Delete</button>` : ''}
    </div>
  `).join('');
  document.getElementById('userListDisplay').innerHTML = html || '<p>No users found.</p>';
}

function addUser() {
  const email = document.getElementById('newUserEmail').value;
  const role = document.getElementById('newUserRole').value;
  if (email) {
    state.users.push({ email, role, name: email.split('@')[0] });
    localStorage.setItem('lab_users', JSON.stringify(state.users));
    document.getElementById('newUserEmail').value = '';
    renderUserList();
  }
}

function deleteUser(email) {
  state.users = state.users.filter(u => u.email !== email);
  localStorage.setItem('lab_users', JSON.stringify(state.users));
  renderUserList();
}

function addNewSite() {
  const name = prompt("Site Name:");
  const path = prompt("Path (e.g., /new-page.html):");
  if (name && path) {
    LAB_CONFIG.sites.push({ name, path, icon: '🌐' });
    renderSites();
  }
}

function handleLogin() {
  const email = document.getElementById('loginEmail').value;
  if (email) {
    state.user = state.users.find(u => u.email === email) || { email, role: 'admin', name: 'User' };
    document.getElementById('authGate').classList.add('hidden');
    document.getElementById('appContainer').classList.remove('hidden');
    document.getElementById('userEmail').textContent = state.user.email;
    document.getElementById('userRole').textContent = state.user.role.toUpperCase();
    document.getElementById('userAvatar').textContent = state.user.name.charAt(0).toUpperCase();
    initApp();
  }
}

function handleLogout() {
  state.user = null;
  document.getElementById('appContainer').classList.add('hidden');
  document.getElementById('authGate').classList.remove('hidden');
}

function handleFiles(files) {
  const list = document.getElementById('fileList');
  list.innerHTML = Array.from(files).map(f => `<div style="padding:5px; background:#f1f5f9; border-radius:4px; margin-bottom:5px; font-size:13px;">📄 ${f.name}</div>`).join('');
}

function processFiles() {
  document.getElementById('resultCard').classList.remove('hidden');
}
</script>
</body>
</html>
