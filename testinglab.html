<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONEID Lab Hub</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; }

/* HEADER WITH HAMBURGER */
.app-header {
  background: white; border-bottom: 1px solid #e2e8f0; padding: 15px 20px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.hamburger {
  background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px;
  display: flex; align-items: center; justify-content: center;
}
.brand { font-weight: 700; font-size: 18px; color: #4f46e5; }

/* LAYOUT */
.app-container { display: flex; min-height: calc(100vh - 60px); }

/* SIDEBAR */
#sidebar {
  position: fixed; left: 0; top: 60px; bottom: 0; width: 280px;
  background: white; border-right: 1px solid #e2e8f0;
  transform: translateX(-100%); transition: transform 0.3s ease;
  z-index: 99; overflow-y: auto;
}
#sidebar.open { transform: translateX(0); }
#sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; z-index: 98;
}
#sidebar-overlay.show { display: block; }

.sidebar-section { padding: 20px 10px; }
.section-title {
  font-size: 11px; text-transform: uppercase; color: #64748b;
  font-weight: 600; padding: 0 15px; margin-bottom: 10px;
}
.nav-item {
  display: flex; align-items: center; padding: 12px 15px;
  cursor: pointer; color: #64748b; border-radius: 8px; margin: 2px 5px;
}
.nav-item:hover, .nav-item.active { background: #f1f5f9; color: #4f46e5; }
.nav-item .icon { font-size: 20px; margin-right: 12px; min-width: 24px; }

.user-section {
  padding: 20px; border-top: 1px solid #e2e8f0; margin-top: auto;
}
.user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.avatar {
  width: 36px; height: 36px; background: #4f46e5; color: white;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 600;
}
.user-details { flex: 1; }
.user-email { font-size: 13px; font-weight: 500; }
.user-role { font-size: 11px; color: #64748b; }
.logout-btn {
  background: none; border: none; color: #ef4444; cursor: pointer;
  font-size: 13px; padding: 5px 0;
}

/* MAIN CONTENT */
#mainContent {
  flex: 1; padding: 20px; width: 100%;
}
.page-title { font-size: 24px; margin-bottom: 5px; }
.page-subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }

.card {
  background: white; border: 1px solid #e2e8f0; border-radius: 12px;
  padding: 24px; margin-bottom: 20px;
}
.card h3 { margin-bottom: 15px; font-size: 16px; }

.dropzone {
  border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px 20px;
  text-align: center; cursor: pointer; transition: all 0.2s;
}
.dropzone:hover { border-color: #4f46e5; background: #f8fafc; }
.dropzone h4 { margin-bottom: 8px; color: #475569; }
.dropzone p { color: #94a3b8; font-size: 14px; }

.btn {
  padding: 12px 24px; border-radius: 8px; border: none;
  font-weight: 600; cursor: pointer; font-size: 14px; width: 100%;
  margin-top: 20px;
}
.btn-primary { background: #4f46e5; color: white; }
.btn-primary:hover { background: #4338ca; }

.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 15px 0; border-bottom: 1px solid #e2e8f0;
}
.setting-row:last-child { border-bottom: none; }
.toggle {
  width: 48px; height: 26px; background: #cbd5e1; border-radius: 13px;
  position: relative; cursor: pointer; transition: 0.3s;
}
.toggle.on { background: #10b981; }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; background: white; border-radius: 50%;
  transition: 0.3s;
}
.toggle.on::after { left: 25px; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white; border-radius: 12px; padding: 24px;
  width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto;
}
.modal h3 { margin-bottom: 20px; }
.modal input, .modal select {
  width: 100%; padding: 12px; margin-bottom: 15px;
  border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px;
}
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn-outline { background: transparent; border: 1px solid #e2e8f0; color: #0f172a; }

.hidden { display: none !important; }

/* DESKTOP */
@media (min-width: 768px) {
  #sidebar {
    position: fixed; left: 0; top: 60px; bottom: 0;
    transform: translateX(0);
  }
  #mainContent { margin-left: 280px; }
  .app-header { padding-left: 300px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <div class="brand">ONEID Lab Hub</div>
  <div style="width: 34px;"></div> <!-- Spacer for balance -->
</div>

<!-- SIDEBAR OVERLAY -->
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-section">
    <div class="section-title">Core Tools</div>
    <div class="nav-item active" onclick="switchTab('migration')">
      <div class="icon">🔄</div>
      <div>Migration Converter</div>
    </div>
    <div class="nav-item" onclick="switchTab('settings')">
      <div class="icon">⚙️</div>
      <div>Universal Settings</div>
    </div>
    <div class="nav-item" onclick="openUserModal()">
      <div class="icon">👥</div>
      <div>User Management</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="section-title">Site Navigator</div>
    <div id="sitesList"></div>
    <div class="nav-item" onclick="addNewSite()">
      <div class="icon">+</div>
      <div>Add New Site</div>
    </div>
  </div>

  <div class="user-section">
    <div class="user-info">
      <div class="avatar" id="userAvatar">A</div>
      <div class="user-details">
        <div class="user-email" id="userEmail">admin@24x7.work</div>
        <div class="user-role" id="userRole">ADMIN</div>
      </div>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent">
  <div id="tabContent"></div>
</div>

<!-- USER MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h3>User Management</h3>
    <input type="email" id="newUserEmail" placeholder="New User Email">
    <select id="newUserRole">
      <option value="sub_admin">Sub Admin</option>
      <option value="employee">Employee</option>
      <option value="viewer">Viewer</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addUser()">Add User</button>
    </div>
    <div id="userListDisplay" style="margin-top:20px;"></div>
  </div>
</div>

<script>
const LAB_CONFIG = {
  sites: [
    { name: 'Home / Dashboard', path: '/index.html', icon: '🌐' },
    { name: 'Login Portal', path: '/login.html', icon: '' },
    { name: 'User Dashboard', path: '/dashboard.html', icon: '' },
    { name: 'Main App', path: '/app.html', icon: '' }
  ],
  settings: {
    auto_linter: true,
    auto_fk_fix: true,
    auto_naming: true,
    require_otp: false
  }
};

let state = {
  user: null,
  activeTab: 'migration',
  users: JSON.parse(localStorage.getItem('lab_users')) || [{ email: 'admin@24x7.work', role: 'admin', name: 'Admin' }]
};

function initApp() {
  renderSites();
  switchTab('migration');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}

function renderSites() {
  const html = LAB_CONFIG.sites.map(site => `
    <div class="nav-item" onclick="window.open('${site.path}', '_blank')">
      <div class="icon">${site.icon}</div>
      <div>${site.name}</div>
    </div>
  `).join('');
  document.getElementById('sitesList').innerHTML = html;
}

function switchTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  
  if (tabId === 'migration') renderMigrationTab();
  else if (tabId === 'settings') renderSettingsTab();
  
  // Close sidebar on mobile after selection
  if (window.innerWidth < 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  }
}

function renderMigrationTab() {
  document.getElementById('tabContent').innerHTML = `
    <h1 class="page-title">Migration Converter</h1>
    <p class="page-subtitle">Upload PDF/DOCX to generate PostgreSQL scripts.</p>
    
    <div class="card">
      <h3>1. Upload Files</h3>
      <div class="dropzone" onclick="document.getElementById('fileInput').click()">
        <h4>Click to upload or drag & drop</h4>
        <p>Supports .pdf, .docx, .zip</p>
      </div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
      <div id="fileList" style="margin-top:15px;"></div>
      <button class="btn btn-primary" onclick="processFiles()">Extract & Analyze</button>
    </div>
    
    <div class="card hidden" id="resultCard">
      <h3>2. Results</h3>
      <p style="color:#10b981; margin-bottom:15px;">✅ Processing complete.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary" style="flex:1; min-width:150px; margin:0;">Download ZIP</button>
        <button class="btn btn-outline" style="flex:1; min-width:150px; margin:0;">Copy SQL</button>
      </div>
    </div>
  `;
}

function renderSettingsTab() {
  const html = Object.keys(LAB_CONFIG.settings).map(key => {
    const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    const isOn = LAB_CONFIG.settings[key] ? 'on' : '';
    return `
      <div class="setting-row">
        <div>
          <div style="font-weight:500;">${label}</div>
          <div style="font-size:12px; color:#64748b;">Toggle this feature</div>
        </div>
        <div class="toggle ${isOn}" onclick="toggleSetting('${key}', this)"></div>
      </div>
    `;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <h1 class="page-title">Universal Settings</h1>
    <p class="page-subtitle">Configure Lab Hub behavior.</p>
    
    <div class="card">
      <h3>Processing & Linter</h3>
      ${html}
    </div>
  `;
}

function toggleSetting(key, el) {
  LAB_CONFIG.settings[key] = !LAB_CONFIG.settings[key];
  el.classList.toggle('on');
}

function openUserModal() {
  document.getElementById('userModal').classList.add('active');
  renderUserList();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function renderUserList() {
  const html = state.users.map(u => `
    <div style="display:flex; justify-content:space-between; padding:10px; background:#f8fafc; border-radius:6px; margin-bottom:5px;">
      <div>
        <div style="font-weight:500;">${u.name}</div>
        <div style="font-size:12px; color:#64748b;">${u.email} • ${u.role}</div>
      </div>
      ${u.role !== 'admin' ? `<button class="btn btn-outline" style="padding:5px 10px; font-size:12px; color:#ef4444;" onclick="deleteUser('${u.email}')">Delete</button>` : ''}
    </div>
  `).join('');
  document.getElementById('userListDisplay').innerHTML = html || '<p>No users found.</p>';
}

function addUser() {
  const email = document.getElementById('newUserEmail').value;
  const role = document.getElementById('newUserRole').value;
  if (email) {
    state.users.push({ email, role, name: email.split('@')[0] });
    localStorage.setItem('lab_users', JSON.stringify(state.users));
    document.getElementById('newUserEmail').value = '';
    renderUserList();
  }
}

function deleteUser(email) {
  state.users = state.users.filter(u => u.email !== email);
  localStorage.setItem('lab_users', JSON.stringify(state.users));
  renderUserList();
}

function addNewSite() {
  const name = prompt("Site Name:");
  const path = prompt("Path (e.g., /new-page.html):");
  if (name && path) {
    LAB_CONFIG.sites.push({ name, path, icon: '🌐' });
    renderSites();
  }
}

function handleLogin() {
  const email = prompt("Enter email:");
  if (email) {
    state.user = state.users.find(u => u.email === email) || { email, role: 'admin', name: 'User' };
    document.getElementById('userEmail').textContent = state.user.email;
    document.getElementById('userRole').textContent = state.user.role.toUpperCase();
    document.getElementById('userAvatar').textContent = state.user.name.charAt(0).toUpperCase();
    initApp();
  }
}

function handleLogout() {
  state.user = null;
  location.reload();
}

function handleFiles(files) {
  const list = document.getElementById('fileList');
  list.innerHTML = Array.from(files).map(f => `<div style="padding:8px; background:#f1f5f9; border-radius:4px; margin-bottom:5px; font-size:13px;">📄 ${f.name}</div>`).join('');
}

function processFiles() {
  document.getElementById('resultCard').classList.remove('hidden');
}

// Auto-login for testing
handleLogin();
</script>
</body>
</html>
