<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONEID Dashboard</title>

<link rel="stylesheet" href="css/login.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
}

header{
    background:#1f3a93;
    color:#fff;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    margin:0;
}

.logout-btn{
    background:#fff;
    color:#1f3a93;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin-top:0;
    color:#1f3a93;
}

footer{
    text-align:center;
    margin-top:40px;
    color:#666;
    padding:20px;
}

</style>

</head>

<body>

<header>

<h2>ONEID Dashboard</h2>

<button class="logout-btn" id="logoutBtn">
Logout
</button>

</header>

<div class="container">

<div class="grid">

<div class="card">
<h3>Organizations</h3>
<p>Manage Organizations</p>
</div>

<div class="card">
<h3>Users</h3>
<p>Manage Users</p>
</div>

<div class="card">
<h3>Roles</h3>
<p>Manage Roles & Permissions</p>
</div>

<div class="card">
<h3>Parties</h3>
<p>Customers & Suppliers</p>
</div>

<div class="card">
<h3>Products</h3>
<p>Inventory & Products</p>
</div>

<div class="card">
<h3>CRM</h3>
<p>Leads & Opportunities</p>
</div>

<div class="card">
<h3>HRMS</h3>
<p>Employees & Payroll</p>
</div>

<div class="card">
<h3>Reports</h3>
<p>Business Reports</p>
</div>

</div>

</div>

<footer>

ONEID ERP v1.2.0 • Migration 001–100

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>

document.getElementById("logoutBtn").onclick = async ()=>{

await supabase.auth.signOut();

window.location.href="login.html";

};

</script>

</body>
</html>
